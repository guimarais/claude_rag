[project]
name = "claude-rag"
version = "0.1.0"
description = "Production-ready RAG system with hybrid retrieval, multi-format document ingestion, and MCP-based tool selection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Backend
    "fastapi>=0.115.0",  # Updated: for anyio 4.x compatibility with mcp
    "uvicorn[standard]>=0.31.1",  # Updated: required by mcp 1.25.0
    "python-multipart>=0.0.9",  # Updated: required by mcp 1.25.0
    "httpx>=0.27.0",  # Updated: required by chromadb 1.4.1

    # Document Processing
    "pypdf==3.17.0",
    "pdfplumber==0.10.3",
    "python-docx==1.1.0",
    "python-pptx==0.6.23",
    "pandas==2.1.3",
    "openpyxl==3.1.2",
    "markdown==3.5.1",
    "beautifulsoup4==4.12.2",
    "html5lib==1.1",
    "trafilatura==1.6.2",
    "lxml>=4.9.2",

    # Retrieval
    "chromadb==1.4.1",  # Fixed: precompiled wheels, no C++ build needed
    "rank-bm25==0.2.2",
    "sentence-transformers==2.7.0",  # Updated for torch compatibility

    # Image Processing / ML
    "Pillow==10.1.0",
    "transformers==4.42.0",  # Updated for sentence-transformers compatibility
    "torch==2.4.0",  # Added: explicit version with CUDA support

    # MCP
    "mcp==1.25.0",  # Fixed: correct version

    # Frontend
    "streamlit==1.28.1",
    "requests==2.31.0",

    # Configuration
    "pyyaml==6.0.1",

    # Text Processing
    "langchain==1.2.4",  # Updated: stable 1.x version
    "langchain-core==1.2.7",  # Added: required for langchain 1.x
]
