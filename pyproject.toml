[project]
name = "claude-rag"
version = "0.1.0"
description = "Production-ready RAG system with hybrid retrieval, multi-format document ingestion, and MCP-based tool selection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Backend
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "python-multipart==0.0.6",
    "httpx==0.25.2",

    # Document Processing
    "pypdf==3.17.0",
    "pdfplumber==0.10.3",
    "python-docx==1.1.0",
    "python-pptx==0.6.23",
    "pandas==2.1.3",
    "openpyxl==3.1.2",
    "markdown==3.5.1",
    "beautifulsoup4==4.12.2",
    "html5lib==1.1",
    "trafilatura==1.6.2",
    "lxml==4.9.3",

    # Retrieval
    "chromadb==0.4.18",
    "rank-bm25==0.2.2",
    "sentence-transformers==2.2.2",

    # Image Processing
    "Pillow==10.1.0",
    "transformers==4.35.2",

    # MCP
    "mcp==0.1.0",

    # Frontend
    "streamlit==1.28.1",
    "requests==2.31.0",

    # Configuration
    "pyyaml==6.0.1",

    # Text Processing
    "langchain==0.0.335",
]
